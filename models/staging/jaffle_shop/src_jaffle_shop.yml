version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    freshness: # default freshness
        # changed to config in v1.9
        warn_after: {count: 4, period: day}
        error_after: {count: 7, period: day}
    loaded_at_field: _etl_loaded_at

    tables:
      - name: customers
        freshness: null
      - name: orders